<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Splat Express - login complete</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
  code { display: block; word-break: break-all; padding: .75rem; background: #8881; border-radius: .5rem; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
</style>
</head>
<body>
<h1>Login complete</h1>
<p id="msg">Reading the result...</p>
<code id="code" hidden></code>
<p><small>This page only shows the code from the address bar. It stores and sends nothing.</small></p>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get("code"), err = p.get("error");
  const msg = document.getElementById("msg"), box = document.getElementById("code");
  if (code) { msg.textContent = "Copy this code back to the poster tool:"; box.textContent = code; box.hidden = false; }
  else if (err) { msg.textContent = "TikTok returned an error: " + err; }
  else { msg.textContent = "Nothing to show. Start the login from the poster tool."; }
</script>
</body>
</html>
